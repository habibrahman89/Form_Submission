<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Form</title>
  <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
<div class="container mt-5">
  <div class="card p-4">
    <h4>Form Submission</h4>
    <form id="form" method="POST" action="submit.php">
      <input class="form-control mb-2" name="name" required placeholder="Name">
      <input class="form-control mb-2" name="email" type="email" required placeholder="Email">
      <input class="form-control mb-2" name="contact_number" required placeholder="Contact Number">
      <select class="form-control mb-2" name="gender" required>
        <option value="" disabled selected>Choose...</option>
        <option value="male">Male</option>
        <option value="female">Female</option>
      </select>
      <textarea class="form-control mb-2" name="message" required placeholder="Message"></textarea>
      <div class="form-check mb-2">
        <input class="form-check-input" type="checkbox" id="age" name="age">
        <label class="form-check-label" for="age">Over 18</label>
      </div>
      <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" id="ex" name="ex" required>
        <label class="form-check-label" for="ex">Agree</label>
      </div>
      <button class="btn btn-primary" type="submit">Submit</button>
    </form>
  </div>
</div>

<script>
$("#form").submit(function(e){
  e.preventDefault();
  let formData = new FormData(this);
  formData.set("age", $("#age").is(":checked") ? "Yes" : "No");
  formData.set("ex", $("#ex").is(":checked") ? "Yes" : "No");

  $.ajax({
    url: "submit.php",
    type: "POST",
    data: formData,
    cache: false,
    contentType: false,
    processData: false,
    success: function(res){
      // Accept JSON string or parsed object
      let result = (typeof res === "string") ? JSON.parse(res || '{}') : res;
      if(result.status === "success"){
        Swal.fire("Success", "Submitted Successfully!", "success");
        $("#form")[0].reset();
      } else {
        Swal.fire("Error", result.message || "Server error", "error");
      }
    },
    error: function(xhr, status, err){
      Swal.fire("Error", "Server Error", "error");
      console.error("AJAX error:", status, err, xhr.responseText);
    }
  });
});
</script>
</body>
</html>
